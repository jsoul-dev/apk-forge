name: 1. Manual Patch
permissions: write-all
env:
  repository: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
on:
  workflow_dispatch:
    inputs:
      org:
        description: 'Which app or patch suite do you want to patch?'
        required: true
        default: 'Morphe'
        type: choice
        options:
          - 'All'
          - 'Morphe'
          - 'Brave'
          - 'Hushfacebook'
          - 'HushMessenger'
          - 'HushGram'
          - 'HushFeed'
          - 'Hxreborn'
          - 'Piko-NewX'
          - 'Pinterest'
          - 'GooglePhotos'
          - 'Gboard'
          - 'Discord'
  workflow_call:
    inputs:
      org:
        required: true
        type: string

jobs:
  patch_morphe:
    name: Patch Morphe (YouTube & Music)
    if: ${{ github.event.inputs.org == 'Morphe' || github.event.inputs.org == 'All' || inputs.org == 'Morphe' || inputs.org == 'All' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Preparing to patch
        uses: ./.github/actions/preparing
      - name: Check github connection
        id: check-gh-morphe
        run: bash src/etc/connection.sh
      - name: Patch apk
        if: steps.check-gh-morphe.outputs.internet_error == '0'
        run: bash src/build/morphe.sh ${{ matrix.run }}
      - name: Releasing APK files
        if: steps.check-gh-morphe.outputs.internet_error == '0'
        uses: ./.github/actions/release

  patch_brave:
    name: Patch Brave Browser & Beta
    if: ${{ github.event.inputs.org == 'Brave' || github.event.inputs.org == 'All' || inputs.org == 'Brave' || inputs.org == 'All' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Preparing to patch
        uses: ./.github/actions/preparing
      - name: Check github connection
        id: check-gh-brave
        run: bash src/etc/connection.sh
      - name: Patch apk
        if: steps.check-gh-brave.outputs.internet_error == '0'
        run: bash src/build/brave.sh ${{ matrix.run }}
      - name: Releasing APK files
        if: steps.check-gh-brave.outputs.internet_error == '0'
        uses: ./.github/actions/release

  patch_hush_facebook:
    name: Patch Facebook (Hushfacebook)
    if: ${{ github.event.inputs.org == 'Hushfacebook' || github.event.inputs.org == 'All' || inputs.org == 'Hushfacebook' || inputs.org == 'All' }}
