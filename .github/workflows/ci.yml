name: 2. Check new patch
permissions: write-all
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  check:
    name: Check upstream patches
    runs-on: ubuntu-latest
    env:
      repository: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Check github connection
        id: check-gh
        run: bash src/etc/connection.sh

      - name: Check Morphe (YouTube & Music)
        id: check-morphe
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh MorpheApp/morphe-patches latest youtube-morphe.apk

      - name: Check Brave (dh6k)
        id: check-brave
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh dh6k/morphe-patches latest brave-browser-arm64-v8a-brave.apk

      - name: Check Hushfacebook
        id: check-hushfacebook
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh SysAdminDoc/Hushfacebook latest facebook-arm64-v8a-hushfacebook.apk

      - name: Check HushMessenger
        id: check-hushmessenger
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh SysAdminDoc/HushMessenger latest messenger-arm64-v8a-hushmessenger.apk

      - name: Check HushGram
        id: check-hushgram
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh SysAdminDoc/HushGram latest instagram-arm64-v8a-hushgram.apk

      - name: Check Hushfeed (TikTok)
        id: check-hushfeed
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh SysAdminDoc/hushfeed latest tiktok-hushfeed.apk

      - name: Check Hxreborn (Duolingo, Proton)
        id: check-hxreborn
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh hxreborn/morphe-patches latest duolingo-hxreborn.apk

      - name: Check Piko NewX (Twitter / X)
        id: check-twitter-piko-newx
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh crimera/piko-newx latest twitter-piko-newx.apk

      - name: Check Browzomje (Pinterest)
        id: check-browzomje
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh browzomje/browzomje-patches latest pinterest-browzomje.apk

      - name: Check Morphe Google Photos
        id: check-google-photos
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh Akash-Sriram/morphe-google-photos latest google-photos-arm64-v8a-google-photos.apk

      - name: Check Gboard Patches
        id: check-gboard
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh jasonwu1994/Gboard-patches latest gboard-gboard.apk

      - name: Check Discord Revenge
        id: check-discord
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh revenge-mod/revenge-xposed latest discord-revenge.apk

    outputs:
      check_morphe: ${{ steps.check-morphe.outputs.new_patch }}
      check_brave: ${{ steps.check-brave.outputs.new_patch }}
      check_hushfacebook: ${{ steps.check-hushfacebook.outputs.new_patch }}
      check_hushmessenger: ${{ steps.check-hushmessenger.outputs.new_patch }}
      check_hushgram: ${{ steps.check-hushgram.outputs.new_patch }}
      check_hushfeed: ${{ steps.check-hushfeed.outputs.new_patch }}
      check_hxreborn: ${{ steps.check-hxreborn.outputs.new_patch }}
      check_twitter_piko_newx: ${{ steps.check-twitter-piko-newx.outputs.new_patch }}
      check_browzomje: ${{ steps.check-browzomje.outputs.new_patch }}
      check_google_photos: ${{ steps.check-google-photos.outputs.new_patch }}
      check_gboard: ${{ steps.check-gboard.outputs.new_patch }}
      check_discord: ${{ steps.check-discord.outputs.new_patch }}

  Patch-Morphe:
    name: Patch Morphe
    needs: check
    if: ${{ needs.check.outputs.check_morphe == '1' }}
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      org: "Morphe"

  Patch-Brave:
    name: Patch Brave
    needs: check
    if: ${{ needs.check.outputs.check_brave == '1' }}
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      org: "Brave"

  Patch-Hushfacebook:
    name: Patch Hushfacebook
    needs: check
    if: ${{ needs.check.outputs.check_hushfacebook == '1' }}
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      org: "Hushfacebook"

  Patch-HushMessenger:
    name: Patch HushMessenger
    needs: check
    if: ${{ needs.check.outputs.check_hushmessenger == '1' }}
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      org: "HushMessenger"

  Patch-HushGram:
    name: Patch HushGram
    needs: check
    if: ${{ needs.check.outputs.check_hushgram == '1' }}
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      org: "HushGram"

  Patch-HushFeed:
    name: Patch HushFeed
    needs: check
    if: ${{ needs.check.outputs.check_hushfeed == '1' }}
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      org: "HushFeed"

  Patch-Hxreborn:
    name: Patch Hxreborn
    needs: check
    if: ${{ needs.check.outputs.check_hxreborn == '1' }}
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      org: "Hxreborn"

  Patch-Twitter-Piko-NewX:
    name: Patch Twitter Piko NewX
    needs: check
    if: ${{ needs.check.outputs.check_twitter_piko_newx == '1' }}
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      org: "Piko-NewX"

  Patch-Browzomje:
    name: Patch Browzomje
    needs: check
    if: ${{ needs.check.outputs.check_browzomje == '1' }}
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      org: "Pinterest"

  Patch-GooglePhotos:
    name: Patch Google Photos
    needs: check
    if: ${{ needs.check.outputs.check_google_photos == '1' }}
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      org: "GooglePhotos"

  Patch-Gboard:
    name: Patch Gboard
    needs: check
    if: ${{ needs.check.outputs.check_gboard == '1' }}
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      org: "Gboard"

  Patch-Discord:
    name: Patch Discord
    needs: check
    if: ${{ needs.check.outputs.check_discord == '1' }}
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      org: "Discord"
