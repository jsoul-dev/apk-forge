name: Releasing APK files
runs:
  using: "composite"
  steps:
    - name: Generate release info
      shell: bash
      run: |
        echo "## 🚀 Rolling Release (Always Up-to-Date)

        This repository operates as a **single continuous release**. Whenever upstream patches update, GitHub Actions rebuilds and updates the respective APK directly in this release.

        Browse the [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for quick download buttons, architecture details, and setup instructions.

        ### 📦 Upstream Patch Sources
        - **YouTube & YouTube Music**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases/latest)
        - **Brave & Brave Beta**: [dh6k/morphe-patches](https://github.com/dh6k/morphe-patches/releases/latest)
        - **Facebook**: [SysAdminDoc/Hushfacebook](https://github.com/SysAdminDoc/Hushfacebook/releases/latest)
        - **Messenger**: [SysAdminDoc/HushMessenger](https://github.com/SysAdminDoc/HushMessenger/releases/latest)
        - **Instagram**: [SysAdminDoc/HushGram](https://github.com/SysAdminDoc/HushGram/releases/latest)
        - **TikTok**: [SysAdminDoc/hushfeed](https://github.com/SysAdminDoc/hushfeed/releases/latest)
        - **Duolingo, Proton Mail & VPN**: [hxreborn/morphe-patches](https://github.com/hxreborn/morphe-patches/releases/latest)
        - **Twitter / X**: [crimera/piko-newx](https://github.com/crimera/piko-newx/releases/latest)
        - **Pinterest**: [browzomje/browzomje-patches](https://github.com/browzomje/browzomje-patches/releases/latest)
        - **Google Photos**: [Akash-Sriram/morphe-google-photos](https://github.com/Akash-Sriram/morphe-google-photos/releases/latest)
        - **Gboard**: [jasonwu1994/Gboard-patches](https://github.com/jasonwu1994/Gboard-patches/releases/latest)
        - **Discord**: [revenge-mod/revenge-xposed](https://github.com/revenge-mod/revenge-xposed/releases/latest)
        " > ${{ github.workspace }}-CHANGELOG.txt
    - name: Release
      uses: ncipollo/release-action@v1.21.0
      with:
        artifacts: |
          ./release/*.apk
        name: Continuous Release
        tag: all
        bodyFile: ${{ github.workspace }}-CHANGELOG.txt
        allowUpdates: true
        replacesArtifacts: true
