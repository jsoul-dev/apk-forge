name: Releasing APK files
runs:
  using: "composite"
  steps:
    - name: Release
      uses: ncipollo/release-action@v1.21.0
      with:
        artifacts: |
          ./release/*.apk
        name: APK Collection
        tag: all
        bodyFile: ${{ github.workspace }}/src/etc/release-notes.md
        allowUpdates: true
        replacesArtifacts: true
