<svg width="100%" height="4" viewBox="0 0 1200 4" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Subtle ambient track gradient -->
    <linearGradient id="forge_divider_base" x1="0" y1="2" x2="1200" y2="2" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0070F3" stop-opacity="0"/>
      <stop offset="15%" stop-color="#0070F3" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="85%" stop-color="#0070F3" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing animated beam gradient -->
    <linearGradient id="forge_beam_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0070F3" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00F0FF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="1"/>
      <stop offset="75%" stop-color="#EC4899" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes glide {
      0% { x: -400px; }
      100% { x: 1200px; }
    }
    .glowing-beam {
      animation: glide 3.5s linear infinite;
    }
  </style>

  <!-- Base track -->
  <path d="M0 2H1200" stroke="url(#forge_divider_base)" stroke-width="2" stroke-linecap="round"/>

  <!-- Animated runner beam -->
  <rect class="glowing-beam" x="-400" y="0.5" width="400" height="3" rx="1.5" fill="url(#forge_beam_grad)">
    <animate attributeName="x" from="-400" to="1200" dur="3.5s" repeatCount="indefinite" />
  </rect>
</svg>
